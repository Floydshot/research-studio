name: Update stocks and deploy dashboard

on:
  schedule:
    # Every day at fixed UTC: 08:30 CEST / 07:30 CET (Europe/Berlin).
    # GitHub schedules are best effort and may start later than scheduled.
    - cron: '30 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - public-redirect.html
      - legacy.html
      - data.json
      - update_data.py
      - requirements.txt
      - .github/workflows/daily_update.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-dashboard-main
  cancel-in-progress: false

jobs:
  update-and-stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.pages-name.outputs.artifact_name }}
      market_data_outcome: ${{ steps.market-data.outcome }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        if: github.event_name != 'push'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: github.event_name != 'push'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh market data
        id: market-data
        if: github.event_name != 'push'
        # Publish explicit stale status on a total provider outage, then flag
        # the run as failed after deployment so it remains visible in Actions.
        continue-on-error: true
        run: python update_data.py

      - name: Commit updated dataset
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add -- data.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh stock dashboard data'
          # An intervening human push must not be overwritten.
          git pull --rebase origin main
          git push origin HEAD:main

      # A GITHUB_TOKEN commit does not trigger a branch-based Pages build.
      # Deploy the updated files explicitly in this same workflow instead.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public redirect, market data and legacy export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -- public-redirect.html _site/index.html
          cp -- data.json legacy.html _site/
          touch _site/.nojekyll

      # Preserve the actual build-attempt name as a job output. Re-running only
      # the deployment must select this artifact, not the newer run_attempt.
      - name: Name GitHub Pages artifact
        id: pages-name
        shell: bash
        run: echo "artifact_name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages-name.outputs.artifact_name }}
          path: _site

  # A dependent job starts after the artifact upload has fully finished and is
  # the deployment structure recommended by actions/deploy-pages.
  deploy:
    needs: update-and-stage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.update-and-stage.outputs.artifact_name }}

      - name: Report provider outage
        if: needs.update-and-stage.outputs.market_data_outcome == 'failure'
        run: |
          echo '::error::Market data update failed. Last available values and stale status were published; inspect the refresh step.'
          exit 1
